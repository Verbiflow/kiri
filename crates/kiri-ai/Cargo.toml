[package]
name = "kiri-ai"
description = "Provider authentication, commit drafting, and validated change planning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.98"
base64 = "=0.22.1"
bytes = "=1.10.1"
fastrand = "=2.3.0"
futures = "=0.3.32"
httpdate = "=1.0.3"
kiri-core = { path = "../kiri-core" }
kiri-analysis = { path = "../kiri-analysis" }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }
rig-core = { version = "=0.40.0", default-features = false }
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.19.1"
tokio = { version = "=1.52.3", features = ["time", "sync", "process", "io-util", "net", "rt-multi-thread", "macros", "fs"] }
