name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.1 fmt --all -- --check
      - run: cargo +1.93.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.93.1 test --locked --workspace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: cargo +1.93.1 build --locked -p kiri-service --bin kiri-engine
      - run: npm --prefix packages/client ci --ignore-scripts
      - run: npm --prefix packages/client run generate
      - run: git diff --exit-code -- packages/client/src/request.ts packages/client/src/frame.ts packages/client/src/schema.json
      - run: npm --prefix packages/client test
      - run: cargo +1.93.1 check --locked -p kiri-core --no-default-features
      - run: cargo +1.93.1 build --locked --release --workspace
      - run: python3 scripts/verify_tui.py --binary target/release/kiri
      - run: python3 scripts/verify_tui.py --binary target/release/kiri --color always
      - run: python3 scripts/verify_tui.py --binary target/release/kiri --color auto
      - run: python3 scripts/verify_tui.py --binary target/release/kiri --color never
