[package]
name = "kiri-core"
description = "UI-independent Git operations, change models, and workspace storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
schema = ["dep:schemars"]
syntax = ["dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-bash", "dep:tree-sitter-css", "dep:tree-sitter-go", "dep:tree-sitter-html", "dep:tree-sitter-javascript", "dep:tree-sitter-json", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-toml-ng", "dep:tree-sitter-typescript"]

[dependencies]
anyhow = "=1.0.98"
fs2 = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
schemars = { version = "=1.0.4", optional = true }
sha2 = "=0.10.9"
tempfile = "=3.19.1"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
tree-sitter = { version = "=0.24.7", optional = true }
tree-sitter-bash = { version = "=0.23.3", optional = true }
tree-sitter-css = { version = "=0.23.2", optional = true }
tree-sitter-go = { version = "=0.23.4", optional = true }
tree-sitter-highlight = { version = "=0.24.7", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-javascript = { version = "=0.23.1", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-python = { version = "=0.23.6", optional = true }
tree-sitter-rust = { version = "=0.23.3", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
