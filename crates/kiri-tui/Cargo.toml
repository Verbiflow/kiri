[package]
name = "kiri-tui"
description = "Ratatui interface for Kiri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kiri-core = { path = "../kiri-core", features = ["syntax"] }
kiri-ai = { path = "../kiri-ai" }
kiri-service = { path = "../kiri-service" }
anyhow = "=1.0.98"
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures = "=0.3.32"
unicode-width = "=0.2.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tui-textarea = "=0.7.0"
serde_json = "=1.0.150"

[dev-dependencies]
cpu-time = "=1.0.0"
